<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Pika's Novel Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --subtext-color: #6c757d;
      --border-color: #e9ecef;
      --accent-color: #7c3aed;
      --accent-hover: #6d28d9;
      --nav-bg: rgba(255, 255, 255, 0.95);
      --font-size: 19px;
      --line-height: 1.85;
      --content-max-width: 800px;
    }

    [data-theme="sepia"] {
      --bg-color: #f4ecd8;
      --card-bg: #faf4e8;
      --text-color: #433422;
      --subtext-color: #796e62;
      --border-color: #e6dcbe;
      --accent-color: #a85a1a;
      --accent-hover: #8f4b13;
      --nav-bg: rgba(250, 244, 232, 0.95);
    }

    [data-theme="dark"] {
      --bg-color: #121316;
      --card-bg: #1c1e24;
      --text-color: #e5e7eb;
      --subtext-color: #9ca3af;
      --border-color: #2e323b;
      --accent-color: #a78bfa;
      --accent-hover: #c4b5fd;
      --nav-bg: rgba(28, 30, 36, 0.95);
    }

    [data-theme="black"] {
      --bg-color: #000000;
      --card-bg: #0d0d0d;
      --text-color: #d1d5db;
      --subtext-color: #808080;
      --border-color: #222222;
      --accent-color: #93c5fd;
      --accent-hover: #bfdbfe;
      --nav-bg: rgba(13, 13, 13, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--font-size);
      line-height: var(--line-height);
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .book-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--accent-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--border-color);
    }

    /* Bookshelf View */
    #shelfView {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      width: 100%;
    }

    .shelf-header {
      margin-bottom: 24px;
    }

    .shelf-title {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    .shelf-desc {
      font-size: 0.95rem;
      color: var(--subtext-color);
    }

    .novel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .novel-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: row;
      gap: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .novel-card-cover {
      width: 100px;
      height: 145px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      border: 1px solid var(--border-color);
    }

    .novel-card-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    @media (max-width: 480px) {
      .novel-card {
        flex-direction: column;
      }
      .novel-card-cover {
        width: 100%;
        height: 200px;
      }
    }

    .novel-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border-color: var(--accent-color);
    }

    .novel-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-color);
      line-height: 1.4;
    }

    .novel-card-orig {
      font-size: 0.85rem;
      color: var(--subtext-color);
      font-style: italic;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag-chip {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--subtext-color);
    }

    .novel-card-synopsis {
      font-size: 0.88rem;
      color: var(--subtext-color);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .novel-card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
      font-size: 0.85rem;
      color: var(--accent-color);
      font-weight: 600;
    }

    /* Reader View */
    #readerView {
      display: none;
      flex: 1;
      width: 100%;
      max-width: var(--content-max-width);
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .reader-header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--border-color);
    }

    .reader-chapter-title {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .reader-meta {
      font-size: 0.85rem;
      color: var(--subtext-color);
    }

    .novel-body p {
      margin-bottom: 1.25em;
      text-align: justify;
      text-justify: inter-cluster;
      letter-spacing: -0.01em;
    }

    .novel-body p em {
      font-style: italic;
      color: var(--subtext-color);
    }

    .novel-body p strong {
      font-weight: 700;
    }

    .divider {
      text-align: center;
      margin: 2em 0;
      color: var(--subtext-color);
      letter-spacing: 0.4em;
    }

    .chapter-nav-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      gap: 12px;
    }

    .nav-btn {
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Modal / Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 80vh;
      background: var(--card-bg);
      border-radius: 20px 20px 0 0;
      z-index: 210;
      padding: 20px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @media (min-width: 640px) {
      .drawer {
        left: 50%;
        transform: translate(-50%, 100%);
        max-width: 500px;
        border-radius: 20px;
        bottom: 40px;
      }
      .drawer.active {
        transform: translate(-50%, 0) !important;
      }
    }

    .drawer.active {
      transform: translateY(0);
    }

    .drawer-title {
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-label {
      font-size: 0.85rem;
      color: var(--subtext-color);
      font-weight: 500;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .theme-btn {
      padding: 10px 6px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
      background: var(--bg-color);
      color: var(--text-color);
    }

    .theme-btn.active {
      border-color: var(--accent-color);
      font-weight: 700;
    }

    .font-size-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .font-size-btn {
      flex: 1;
      padding: 8px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .chapter-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 350px;
      overflow-y: auto;
    }

    .chapter-item {
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--bg-color);
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .chapter-item:hover, .chapter-item.active {
      background: var(--accent-color);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="header-left" onclick="showShelf()">
      <span class="btn-icon" style="padding: 4px 8px; border: none; font-size: 1rem;">📚</span>
      <span class="book-title" id="topBookTitle">Pika's Bookshelf</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" id="btnShelf" onclick="showShelf()" style="display: none;">
        🏠 ชั้นหนังสือ
      </button>
      <button class="btn-icon" id="btnChapters" onclick="openDrawer('chapterDrawer')" style="display: none;">
        📖 สารบัญ
      </button>
      <button class="btn-icon" onclick="openDrawer('settingDrawer')">
        ⚙️ ตั้งค่า
      </button>
    </div>
  </header>

  <!-- Bookshelf Screen -->
  <section id="shelfView">
    <div class="shelf-header">
      <h1 class="shelf-title">📚 ชั้นหนังสือนิยาย</h1>
      <p class="shelf-desc">เลือกเรื่องที่ต้องการอ่าน แปลไทยสำนวนสละสลวย</p>
    </div>
    <div class="novel-grid" id="novelGrid">
      <!-- Injected via JS -->
    </div>
  </section>

  <!-- Novel Reader Screen -->
  <main id="readerView">
    <div class="reader-header">
      <h1 class="reader-chapter-title" id="chapterTitle">กำลังโหลด...</h1>
      <div class="reader-meta" id="chapterMeta">Vol 1</div>
    </div>

    <article class="novel-body" id="novelContent">
      <!-- Chapter text injected here -->
    </article>

    <div class="chapter-nav-bottom">
      <button class="nav-btn" id="prevBtn" onclick="prevChapter()" disabled>
        ← ตอนก่อนหน้า
      </button>
      <button class="nav-btn" onclick="openDrawer('chapterDrawer')">
        สารบัญตอน
      </button>
      <button class="nav-btn" id="nextBtn" onclick="nextChapter()" disabled>
        ตอนถัดไป →
      </button>
    </div>
  </main>

  <!-- Overlay -->
  <div class="drawer-overlay" id="overlay" onclick="closeAllDrawers()"></div>

  <!-- Settings Drawer -->
  <div class="drawer" id="settingDrawer">
    <div class="drawer-title">
      <span>ตั้งค่าการอ่าน</span>
      <button class="close-btn" onclick="closeAllDrawers()">&times;</button>
    </div>

    <div class="setting-group">
      <div class="setting-label">ธีมสีพื้นหลัง</div>
      <div class="theme-grid">
        <button class="theme-btn active" onclick="setTheme('light')">ขาว</button>
        <button class="theme-btn" onclick="setTheme('sepia')">ถนอมสายตา</button>
        <button class="theme-btn" onclick="setTheme('dark')">เทาดำ</button>
        <button class="theme-btn" onclick="setTheme('black')">มืดสนิท</button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">ขนาดตัวอักษร (<span id="fontSizeDisplay">19px</span>)</div>
      <div class="font-size-controls">
        <button class="font-size-btn" onclick="changeFontSize(-1)">A-</button>
        <button class="font-size-btn" onclick="changeFontSize(1)">A+</button>
      </div>
    </div>
  </div>

  <!-- Chapters Drawer -->
  <div class="drawer" id="chapterDrawer">
    <div class="drawer-title">
      <span>สารบัญตอน</span>
      <button class="close-btn" onclick="closeAllDrawers()">&times;</button>
    </div>
    <ul class="chapter-list" id="chapterList">
      <!-- Injected via JS -->
    </ul>
  </div>

  <script>
    let booksData = [];
    let currentBook = null;
    let chaptersData = [];
    let currentChapterIndex = 0;
    let currentFontSize = 19;

    async function init() {
      // Load saved settings
      const savedTheme = localStorage.getItem('novel_theme') || 'light';
      setTheme(savedTheme);

      const savedFontSize = localStorage.getItem('novel_font_size');
      if (savedFontSize) {
        currentFontSize = parseInt(savedFontSize, 10);
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
        document.getElementById('fontSizeDisplay').textContent = currentFontSize + 'px';
      }

      // Fetch Books metadata
      try {
        const res = await fetch('books.json');
        booksData = await res.json();
        renderBookshelf();
      } catch (e) {
        console.error("Error loading books:", e);
      }

      // Handle URL params (?book=dragon&ch=1)
      const urlParams = new URLSearchParams(window.location.search);
      const bookId = urlParams.get('book');
      const chNum = parseInt(urlParams.get('ch'), 10) || 1;

      if (bookId) {
        openBook(bookId, chNum - 1);
      }
    }

    function renderBookshelf() {
      const grid = document.getElementById('novelGrid');
      grid.innerHTML = booksData.map(book => `
        <div class="novel-card" onclick="openBook('${book.id}', 0)">
          <img class="novel-card-cover" src="${book.cover}" alt="${book.title}" loading="lazy">
          <div class="novel-card-info">
            <div class="novel-card-title">${book.title}</div>
            <div class="novel-card-orig">${book.originalTitle}</div>
            <div class="tag-container">
              ${book.tags.map(t => `<span class="tag-chip">${t}</span>`).join('')}
            </div>
            <div class="novel-card-synopsis">${book.synopsis}</div>
            <div class="novel-card-footer">
              <span>สถานะ: ${book.status}</span>
              <span>${book.chapterCount > 0 ? book.chapterCount + ' ตอน' : 'เร็วๆ นี้'} →</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function openBook(bookId, startChIndex = 0) {
      currentBook = booksData.find(b => b.id === bookId);
      if (!currentBook) return;

      if (currentBook.chapterCount === 0) {
        alert("เรื่องนี้อยู่ระหว่างจัดเตรียมข้อมูล จะเริ่มแปลเร็วๆ นี้ครับ!");
        return;
      }

      try {
        const res = await fetch(currentBook.chaptersPath);
        chaptersData = await res.json();
        
        document.getElementById('shelfView').style.display = 'none';
        document.getElementById('readerView').style.display = 'block';
        document.getElementById('btnShelf').style.display = 'flex';
        document.getElementById('btnChapters').style.display = 'flex';
        document.getElementById('topBookTitle').textContent = currentBook.title;

        renderChapter(startChIndex >= 0 && startChIndex < chaptersData.length ? startChIndex : 0);
      } catch (err) {
        console.error("Failed to load chapters:", err);
      }
    }

    function showShelf() {
      document.getElementById('shelfView').style.display = 'block';
      document.getElementById('readerView').style.display = 'none';
      document.getElementById('btnShelf').style.display = 'none';
      document.getElementById('btnChapters').style.display = 'none';
      document.getElementById('topBookTitle').textContent = "Pika's Bookshelf";
      window.history.replaceState(null, '', window.location.pathname);
    }

    function renderChapter(index) {
      currentChapterIndex = index;
      const ch = chaptersData[index];
      
      document.getElementById('chapterTitle').textContent = ch.title;
      document.getElementById('chapterMeta').textContent = `${currentBook.title} • ตอนที่ ${ch.chapter}`;
      
      const contentEl = document.getElementById('novelContent');
      contentEl.innerHTML = ch.paragraphs.map(p => {
        if (p.includes('<div class="divider">')) return p;
        return `<p>${p}</p>`;
      }).join('');

      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === chaptersData.length - 1;

      renderChapterList();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Update URL without reload
      const newUrl = `${window.location.pathname}?book=${currentBook.id}&ch=${ch.chapter}`;
      window.history.replaceState(null, '', newUrl);
    }

    function renderChapterList() {
      const listEl = document.getElementById('chapterList');
      listEl.innerHTML = chaptersData.map((ch, idx) => `
        <li class="chapter-item ${idx === currentChapterIndex ? 'active' : ''}" onclick="selectChapter(${idx})">
          <span>${ch.title}</span>
          <span>${idx === currentChapterIndex ? '✓' : ''}</span>
        </li>
      `).join('');
    }

    function selectChapter(idx) {
      renderChapter(idx);
      closeAllDrawers();
    }

    function prevChapter() {
      if (currentChapterIndex > 0) renderChapter(currentChapterIndex - 1);
    }

    function nextChapter() {
      if (currentChapterIndex < chaptersData.length - 1) renderChapter(currentChapterIndex + 1);
    }

    function openDrawer(id) {
      document.getElementById('overlay').classList.add('active');
      document.getElementById(id).classList.add('active');
    }

    function closeAllDrawers() {
      document.getElementById('overlay').classList.remove('active');
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('active'));
    }

    function setTheme(theme) {
      if (theme === 'light') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
      
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(theme));
      });
      localStorage.setItem('novel_theme', theme);
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(Math.max(14, currentFontSize + delta), 28);
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      document.getElementById('fontSizeDisplay').textContent = currentFontSize + 'px';
      localStorage.setItem('novel_font_size', currentFontSize);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
