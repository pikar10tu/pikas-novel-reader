<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>นิยายแปล: หุบปากไปเลยนะยัยมังกรชั่ว! ข้าไม่อยากมีลูกกับเจ้าเพิ่มแล้ว!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --subtext-color: #6c757d;
      --border-color: #e9ecef;
      --accent-color: #7c3aed;
      --accent-hover: #6d28d9;
      --nav-bg: rgba(255, 255, 255, 0.95);
      --font-size: 19px;
      --line-height: 1.85;
      --content-max-width: 760px;
    }

    [data-theme="sepia"] {
      --bg-color: #f4ecd8;
      --card-bg: #faf4e8;
      --text-color: #433422;
      --subtext-color: #796e62;
      --border-color: #e6dcbe;
      --accent-color: #a85a1a;
      --accent-hover: #8f4b13;
      --nav-bg: rgba(250, 244, 232, 0.95);
    }

    [data-theme="dark"] {
      --bg-color: #121316;
      --card-bg: #1c1e24;
      --text-color: #e5e7eb;
      --subtext-color: #9ca3af;
      --border-color: #2e323b;
      --accent-color: #a78bfa;
      --accent-hover: #c4b5fd;
      --nav-bg: rgba(28, 30, 36, 0.95);
    }

    [data-theme="black"] {
      --bg-color: #000000;
      --card-bg: #0d0d0d;
      --text-color: #d1d5db;
      --subtext-color: #808080;
      --border-color: #222222;
      --accent-color: #93c5fd;
      --accent-hover: #bfdbfe;
      --nav-bg: rgba(13, 13, 13, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: var(--font-size);
      line-height: var(--line-height);
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Floating Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .book-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--accent-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-icon {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--border-color);
    }

    /* Modal / Bottom Sheet for Settings & Chapters */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-height: 80vh;
      background: var(--card-bg);
      border-radius: 20px 20px 0 0;
      z-index: 210;
      padding: 20px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @media (min-width: 640px) {
      .drawer {
        left: 50%;
        transform: translate(-50%, 100%);
        max-width: 500px;
        border-radius: 20px;
        bottom: 40px;
      }
      .drawer.active {
        transform: translate(-50%, 0) !important;
      }
    }

    .drawer.active {
      transform: translateY(0);
    }

    .drawer-title {
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-label {
      font-size: 0.85rem;
      color: var(--subtext-color);
      font-weight: 500;
    }

    .theme-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .theme-btn {
      padding: 10px 6px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      font-weight: 500;
      background: var(--bg-color);
      color: var(--text-color);
    }

    .theme-btn.active {
      border-color: var(--accent-color);
      font-weight: 700;
    }

    .font-size-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .font-size-btn {
      flex: 1;
      padding: 8px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* Chapter List in Drawer */
    .chapter-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 350px;
      overflow-y: auto;
    }

    .chapter-item {
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--bg-color);
      color: var(--text-color);
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .chapter-item:hover, .chapter-item.active {
      background: var(--accent-color);
      color: #ffffff;
    }

    /* Main Reader Container */
    main {
      flex: 1;
      width: 100%;
      max-width: var(--content-max-width);
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .reader-header {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px dashed var(--border-color);
    }

    .reader-chapter-title {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.4;
      color: var(--text-color);
      margin-bottom: 6px;
    }

    .reader-meta {
      font-size: 0.85rem;
      color: var(--subtext-color);
    }

    /* Novel Text Body */
    .novel-body p {
      margin-bottom: 1.25em;
      text-align: justify;
      text-justify: inter-cluster;
      letter-spacing: -0.01em;
    }

    .novel-body p em {
      font-style: italic;
      color: var(--subtext-color);
    }

    .novel-body p strong {
      font-weight: 700;
    }

    .divider {
      text-align: center;
      margin: 2em 0;
      color: var(--subtext-color);
      letter-spacing: 0.4em;
    }

    /* Chapter Navigation Bottom */
    .chapter-nav-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      gap: 12px;
    }

    .nav-btn {
      padding: 10px 18px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div class="header-left">
      <span class="book-title" id="topBookTitle">หุบปากไปเลยนะยัยมังกรชั่ว!</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="openDrawer('chapterDrawer')">
        📖 สารบัญ
      </button>
      <button class="btn-icon" onclick="openDrawer('settingDrawer')">
        ⚙️ ตั้งค่า
      </button>
    </div>
  </header>

  <!-- Reader Body -->
  <main>
    <div class="reader-header">
      <h1 class="reader-chapter-title" id="chapterTitle">กำลังโหลด...</h1>
      <div class="reader-meta" id="chapterMeta">Vol 1 Chapter 1</div>
    </div>

    <article class="novel-body" id="novelContent">
      <!-- Chapter content injected here -->
    </article>

    <!-- Bottom Navigation -->
    <div class="chapter-nav-bottom">
      <button class="nav-btn" id="prevBtn" onclick="prevChapter()" disabled>
        ← ตอนก่อนหน้า
      </button>
      <button class="nav-btn" onclick="openDrawer('chapterDrawer')">
        รายการตอน
      </button>
      <button class="nav-btn" id="nextBtn" onclick="nextChapter()" disabled>
        ตอนถัดไป →
      </button>
    </div>
  </main>

  <!-- Overlay -->
  <div class="drawer-overlay" id="overlay" onclick="closeAllDrawers()"></div>

  <!-- Settings Drawer -->
  <div class="drawer" id="settingDrawer">
    <div class="drawer-title">
      <span>ตั้งค่าการอ่าน</span>
      <button class="close-btn" onclick="closeAllDrawers()">&times;</button>
    </div>

    <div class="setting-group">
      <div class="setting-label">โทนสีพื้นหลัง</div>
      <div class="theme-grid">
        <button class="theme-btn active" onclick="setTheme('light')">ขาว</button>
        <button class="theme-btn" onclick="setTheme('sepia')">ถนอมสายตา</button>
        <button class="theme-btn" onclick="setTheme('dark')">เทาดำ</button>
        <button class="theme-btn" onclick="setTheme('black')">มืดสนิท</button>
      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">ขนาดตัวอักษร (<span id="fontSizeDisplay">19px</span>)</div>
      <div class="font-size-controls">
        <button class="font-size-btn" onclick="changeFontSize(-1)">A-</button>
        <button class="font-size-btn" onclick="changeFontSize(1)">A+</button>
      </div>
    </div>
  </div>

  <!-- Chapter Index Drawer -->
  <div class="drawer" id="chapterDrawer">
    <div class="drawer-title">
      <span>สารบัญตอน</span>
      <button class="close-btn" onclick="closeAllDrawers()">&times;</button>
    </div>
    <ul class="chapter-list" id="chapterList">
      <!-- Chapters list injected here -->
    </ul>
  </div>

  <script>
    // Chapter Database (จะอัปเดตเพิ่มตอนใหม่ๆ ตรงนี้ได้อย่างง่ายดาย)
    const chaptersData = [
      {
        id: "ch001",
        vol: 1,
        chNum: 1,
        title: "ตอนที่ 1: พ่ายแพ้จนถูกจับ ย่อมต้องมีใครสักคนที่ตั้งท้อง",
        paragraphs: [
          "ภายในคุกใต้ดินอันมืดสลัวและชื้นแฉะ",
          "ลีออนถูกพันธนาการไว้แน่นหนาด้วยโซ่ผนึกมนตราจนไม่อาจขยับเขยื้อนได้แม้แต่ปลายนิ้ว เกราะอันชำรุดทรุดโทรมแขวนร่องแร่งอยู่บนร่าง รอยแดงสดที่ข้อมือบ่บอกถึงการดิ้นรนอย่างเอาเป็นเอาตาย",
          "ทว่าความพยายามทั้งหมดกลับไร้ผล",
          "เมื่อสามวันก่อน เขานำทัพ ‘กองทัพล่ามังกร’ ของจักรวรรดิมุ่งหน้าสู่วิหารมังกรเงิน ด้วยความมุ่งมั่นที่จะกำจัดมังกรชั่วร้ายที่สร้างความเดือดร้อนให้สิ้นซาก",
          "ทว่าลีออนกลับตกเป็นเหยื่อของการหักหลัง ไม่เพียงแต่จะถูกแทงข้างหลัง เขายังทำให้ที่ตั้งของกองทัพถูกเปิดเผยต่อหน้าเผ่ามังกรเงินอีกด้วย",
          "เมื่อขาดการนำของลีออน กองทัพล่ามังกรจึงแตกพ่ายระส่ำระสายอย่างรวดเร็วและถอยร่นกระจัดกระจายไป ขณะเดียวกัน ลีออนก็ถูกเผ่ามังกรเงินจับกุมตัวได้ทั้งเป็น และถูกคุมขังไว้ในคุกใต้ดินแห่งนี้",
          "ตลอดสามวันที่ผ่านมา ลีออนไม่ได้ดื่มน้ำแม้แต่หยดเดียว ในใจคิดเพียงปรารถนาความตาย",
          "แทนที่จะต้องทนทุกข์ทรมานและรับความอัปยศจากพวกมังกรชั่วร้ายเหล่านี้ เขาขอตายไปให้พ้นๆ ยังจะดีเสียกว่า ทว่าเมื่อถูกพันธนาการด้วยโซ่ผนึกมนตรา แม้แต่การจะปลิดชีพตัวเองก็ยังทำไม่ได้เลย",
          "ท่ามกลางสติอันเลือนราง เขาแว่วได้ยินเสียงเอะอะครึกครื้นดังมาจากไม่ไกล",
          "นั่นคืองานเลี้ยงฉลองของเผ่ามังกร ลีออนได้ยินเรื่องนี้มาจากผู้คุม เป็นงานฉลองยาวนานหนึ่งสัปดาห์ที่จัดขึ้นเพื่อเฉลิมฉลองการล้ม 'ลีออน แคสโมด' นักล่ามังกรที่แข็งแกร่งที่สุดในจักรวรรดิลงได้",
          "<em>ช่างเป็นเผ่าพันธุ์ที่สุรุ่ยสุร่ายสิ้นเปลืองอะไรขนาดนี้</em> ลีออนคิดในใจ",
          "แต่เวลานี้เขาไม่มีทั้งอารมณ์หรือเรี่ยวแรงจะไปวิพากษ์วิจารณ์ใครแล้ว",
          "<strong>แปะ... แปะ...</strong>",
          "หยดน้ำรั่วซึมลงมาในคุกใต้ดิน ตกกระทบลงบนโซ่ตรวนทีละหยด เสียงหยดน้ำอันซ้ำซากจำเจราวกับกำลังนับถอยหลังช่วงเวลาที่เหลืออยู่ในชีวิตของเขา",
          "เวลาผ่านไปนานเท่าใดไม่อาจทราบ ประตูคุกใต้ดินก็เปิดออก",
          "\"พวกเจ้าออกไปให้หมด ข้าต้องการคุยเป็นการส่วนตัวกับวีรบุรุษผู้ยิ่งใหญ่... นักล่ามังกรของเราเสียหน่อย\"",
          "\"พ่ะย่ะค่ะ ฝ่าบาท\"",
          "เสียงประตูปิดลงดังเอี๊ยดอ๊าด ประตูห้องขังปิดสนิท",
          "ตามมาด้วยเสียงรองเท้าส้นสูงกระทบกับพื้นหินเบาๆ เสียงนั้นดังก้องสะท้อนในคุกใต้ดินอันกว้างขวาง ค่อยๆ ใกล้ลีออนเข้ามาเรื่อยๆ",
          "จู่ๆ เสียงฝีเท้าก็หยุดชะงักลงตรงหน้าห้องขังของเขา",
          "ลีออนพยายามฝืนยกศีรษะขึ้น ภาพเบื้องหน้าชวนให้ตื่นตะลึง เส้นผมสีเงินประกายเจิดจ้าดั่งทางช้างเผือกทอดตัวลงมาจากฟากฟ้า ทว่าหางที่โผล่พ้นชายกระโปรงกลับทำให้ลีออนต้องตื่นตัวระวังภัย",
          "<em>ผมสีเงิน หางมังกร ฝ่าบาทงั้นรึ...</em>",
          "ลีออนพลันตระหนักถึงตัวตนของอีกฝ่าย— ราชินีแห่งมังกรเงิน 'รอสวิธา'",
          "รอสวิธาเปิดประตูห้องขัง ย่างกรายเข้ามาด้านใน และหยุดยืนอยู่ตรงหน้าลีออนอย่างเอื่อยเฉื่อย บนตัวนางมีกลิ่นสุราจางๆ ใบหน้าอันหมดจดขึ้นสีระเรื่อเล็กน้อย เห็นได้ชัดว่านางคงสนุกสนานในงานเลี้ยงฉลองมากเกินไปจนเผลอดื่มหนัก",
          "ทั้งสองอยู่ใกล้กันจนสัมผัสได้ถึงลมหายใจ",
          "ทว่าช่างน่าเวทนา...",
          "ฝ่ายหนึ่งตกอยู่ในสภาพน่าสังเวช เสื้อผ้าขาดรุ่ย แม้แต่ชุดเกราะที่ครั้งหนึ่งเคยสง่างาม บัดนี้ก็ทอแสงริบหรี่และเดียวดาย",
          "ขณะที่อีกฝ่ายกลับสวมใส่อาภรณ์หรูหรา สวมชุดราตรีประณีตงดงาม เรือนผมสีเงินไร้ที่ติ นัยน์ตาคมกริบฉายแววเหยียดหยามและขบขัน",
          "แสงย้อนส่องผ่านหน้าต่างบานเดี่ยวของคุกใต้ดิน ทอดเงาลงบนแผ่นหลังของลีออนและส่องสว่างกระทบใบหน้าของราชินีมังกร",

          "\"ถ้าท่านคิดจะฆ่าพวกเขาทันทีที่ลืมตาดูโลก ก็เชิญตามสบาย\"",
          "\"แต่ท่านควรลองคิดดูให้ดีนะว่า ถึงตอนนั้น ข้า... บุรุษคนแรกที่ได้ผสมพันธุ์กับท่าน ก็คงตายไปนานถึงสิบเดือนแล้ว และท่านจะไม่มีวันผสมพันธุ์กับใครหน้าไหนได้อีกชั่วชีวิต\"",
          "\"เมื่อกี้ท่านเพิ่งพูดว่าอะไรนะ? อ้อ ท่านบอกว่าตระกูลของข้าอาจต้องสูญสิ้นสายเลือดสินะ\"",
          "\"ตอนนี้... ท่านเริ่มเข้าใจความรู้สึกของข้าบ้างหรือยังล่ะ?\"",
          "คำพูดของลีออนเชือดเฉือน คมกริบราวดั่งมีดสั้นที่กระหน่ำแทงลงบนหัวใจของรอสวิธาอย่างไม่ปรานี",
          "ทว่าแม้ปากจะเอ่ยวาจาร้ายกาจ ร่างกายของลีออนกลับทรุดโทรมลงอย่างรวดเร็ว",
          "สติเริ่มเลือนราง เปลือกตาหนักอึ้งราวกับแบกน้ำหนักนับพันชั่ง เขาเริ่มรู้สึกได้ว่าอุณหภูมิในร่างกายกำลังค่อยๆ เย็นเฉียบลง วาระสุดท้ายใกล้เข้ามาแล้ว ทว่ามันก็เป็นเรื่องที่ช่วยไม่ได้ ลมหายใจของลีออนเริ่มติดขัด หายใจออกมากกว่าหายใจเข้า",
          "\"ฝ่าบาทคงอยากจะฆ่าเจ้าคนสารเลวที่ทำให้ความบริสุทธิ์ของท่านต้องแปดเปื้อนคนนี้เต็มทนแล้วสินะ? ไม่ต้องลงมือเองหรอก ฝ่าบาท... ข้า... ข้า...\"",
          "ปอดของเขาหยุดการทำงาน หัวใจที่เต้นรัวกระหน่ำอย่างรุนแรงเมื่อครู่เริ่มเต้นแผ่วลงเรื่อยๆ",
          "<em>และด้วยถ้อยคำเหล่านี้ นักล่ามังกร วีรบุรุษแห่งยุคสมัย ก็ได้สิ้นลมหายใจลงในที่สุด</em>",
          "ชิ้นส่วนเกราะที่แตกหักชิ้นสุดท้ายบนบ่าของเขาร่วงหล่น กระทบพื้นหินดังกังวานใส",
          "เสียงนั้นก้องสะท้อนในคุกใต้ดินอันกว้างขวาง กระหน่ำตีลงบนหัวใจของรอสวิธาซ้ำแล้วซ้ำเล่า",
          "เนิ่นนานหลังจากความเงียบงันเข้าปกคลุม ราชินีมังกรเงินจึงค่อยๆ ดึงสติตัวเองกลับมา",
          "นางเงยหน้าขึ้น ในนัยน์ตาสัตว์เลื้อยคลานสีเงินคู่คม พลันมีเปลวเพลิงแห่งความมุ่งมั่นลุกโชนขึ้นมาอย่างไม่มีวันดับสูญ",
          "นางพึมพำกับร่างที่ไร้ลมหายใจนั้น",
          "\"อยากตายงั้นรึ? ไม่ง่ายขนาดนั้นหรอก\"",
          "\"ลีออน แคสโมด... ลูกของเราจะไม่มีพ่อไม่ได้เด็ดขาด!\""
        ]
      }
    ];

    let currentChapterIndex = 0;
    let currentFontSize = 19;

    function renderChapter(index) {
      currentChapterIndex = index;
      const chapter = chaptersData[index];
      
      document.getElementById('chapterTitle').textContent = chapter.title;
      document.getElementById('chapterMeta').textContent = `Volume ${chapter.vol} • Chapter ${chapter.chNum}`;
      
      const contentEl = document.getElementById('novelContent');
      contentEl.innerHTML = chapter.paragraphs.map(p => {
        if (p.includes('<div class="divider">')) return p;
        return `<p>${p}</p>`;
      }).join('');

      // Update button states
      document.getElementById('prevBtn').disabled = index === 0;
      document.getElementById('nextBtn').disabled = index === chaptersData.length - 1;

      renderChapterList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderChapterList() {
      const listEl = document.getElementById('chapterList');
      listEl.innerHTML = chaptersData.map((ch, idx) => `
        <li class="chapter-item ${idx === currentChapterIndex ? 'active' : ''}" onclick="selectChapter(${idx})">
          <span>${ch.title}</span>
          <span>${idx === currentChapterIndex ? '✓' : ''}</span>
        </li>
      `).join('');
    }

    function selectChapter(idx) {
      renderChapter(idx);
      closeAllDrawers();
    }

    function prevChapter() {
      if (currentChapterIndex > 0) renderChapter(currentChapterIndex - 1);
    }

    function nextChapter() {
      if (currentChapterIndex < chaptersData.length - 1) renderChapter(currentChapterIndex + 1);
    }

    // Drawer management
    function openDrawer(id) {
      document.getElementById('overlay').classList.add('active');
      document.getElementById(id).classList.add('active');
    }

    function closeAllDrawers() {
      document.getElementById('overlay').classList.remove('active');
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('active'));
    }

    // Settings
    function setTheme(theme) {
      if (theme === 'light') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', theme);
      }
      
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(theme));
      });
      localStorage.setItem('novel_theme', theme);
    }

    function changeFontSize(delta) {
      currentFontSize = Math.min(Math.max(14, currentFontSize + delta), 28);
      document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
      document.getElementById('fontSizeDisplay').textContent = currentFontSize + 'px';
      localStorage.setItem('novel_font_size', currentFontSize);
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('novel_theme') || 'light';
      setTheme(savedTheme);

      const savedFontSize = localStorage.getItem('novel_font_size');
      if (savedFontSize) {
        currentFontSize = parseInt(savedFontSize, 10);
        document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
        document.getElementById('fontSizeDisplay').textContent = currentFontSize + 'px';
      }

      renderChapter(0);
    });
  </script>
</body>
</html>
